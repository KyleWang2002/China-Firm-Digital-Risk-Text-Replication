[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "china-firm-digital-risk-replication"
version = "0.1.0"
description = "Transparent replication scaffold for digital technology risk measurement from Chinese annual reports"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yuankui Wang" }]
dependencies = []

[project.optional-dependencies]
collect = ["requests>=2.31", "pymupdf>=1.24"]
embedding = ["gensim>=4.3", "numpy>=1.24"]
model = ["torch>=2.1", "transformers>=4.41,<5", "numpy>=1.24"]

[project.scripts]
digirisk = "digirisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
